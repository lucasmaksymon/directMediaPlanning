# Blueprint Render — NextPlanning / NextMedia
# Dashboard: New → Blueprint → conectar este repo
# Docs: https://render.com/docs/infrastructure-as-code

databases:
  - name: nextplanning-db
    plan: free
    databaseName: nextplanning
    postgresMajorVersion: "16"

services:
  - type: web
    name: nextplanning
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: nextplanning-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # Tras el primer deploy, poné la URL pública (https://nextplanning.onrender.com)
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SEED_RESET
        value: "false"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: UPLOADTHING_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_NOTIFY_WHATSAPP
        sync: false
